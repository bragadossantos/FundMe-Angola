services:
  - type: web
    name: fundme-angola
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: fundme-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fundme-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: fundme-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fundme-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fundme-db
          property: password

databases:
  - name: fundme-db
    databaseName: fundme_angola
    user: fundme_user
    plan: free
